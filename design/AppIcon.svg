<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="bshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon body: 824pt squircle on the 1024 grid -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- speech bubble with tail -->
  <g filter="url(#bshadow)">
    <path fill="url(#bubble)" d="
      M 330 262
      H 694
      A 118 118 0 0 1 812 380
      V 578
      A 118 118 0 0 1 694 696
      H 452
      L 332 790
      Q 316 802 318 782
      L 326 694
      A 118 118 0 0 1 212 578
      V 380
      A 118 118 0 0 1 330 262 Z"/>
  </g>

  <!-- prompt: chevron + cursor -->
  <path d="M 370 404 L 450 479 L 370 554" fill="none" stroke="#141416" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="502" y="532" width="164" height="44" rx="22" fill="#FF7A45"/>
</svg>
