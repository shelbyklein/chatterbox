<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f4f4f1"/><g font-family="Arial,sans-serif" fill="#252a2b"><text x="30" y="37" font-size="23">Golem: independent service, optional window</text><rect x="25" y="60" width="470" height="310" rx="15" fill="white" stroke="#aeb6b4"/><text x="45" y="90" font-size="19">Chatterbox → Settings → Plugins</text><rect x="42" y="115" width="435" height="220" rx="12" fill="#eef3f1"/><text x="60" y="145" font-size="18">Golem integration                    Enabled</text><text x="60" y="175" font-size="15">Service: connected · Chat runtime: connected</text><text x="60" y="205" font-size="15">Open Golem    Start service    Pause automation</text><text x="60" y="240" font-size="14">Assistant settings open in Golem.</text><text x="60" y="266" font-size="14">Disabling this plugin disconnects chat access.</text><text x="60" y="292" font-size="14">It does not quit the independent Golem service.</text><rect x="525" y="60" width="450" height="310" rx="15" fill="white" stroke="#aeb6b4"/><text x="545" y="90" font-size="19">Golem.app · optional floating window</text><rect x="545" y="112" width="410" height="65" rx="16" fill="#eef3f1"/><text x="562" y="139" font-size="15">Latest briefing / needs your answer</text><text x="562" y="161" font-size="14">Open chat in Chatterbox</text><ellipse cx="750" cy="208" rx="28" ry="21" fill="#8a9684"/><ellipse cx="750" cy="242" rx="33" ry="17" fill="#768575"/><ellipse cx="750" cy="270" rx="38" ry="16" fill="#647362"/><text x="625" y="311" font-size="15">Message Golem…                 Send</text><text x="30" y="410" font-size="17">Closing either window leaves the services available.</text><text x="30" y="441" font-size="15">Disconnected: cached state + clear status; no silent lost sends or rapid retry loop.</text><text x="30" y="472" font-size="15">Schematic only. Preserve the existing Golem artwork and mini interactions.</text></g></svg>