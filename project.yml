name: Chatterbox
options:
  bundleIdPrefix: com.shelbyklein
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chatterbox:
    type: application
    platform: macOS
    sources:
      - path: Chatterbox
      # Shared with the iPhone app: what the two say to each other.
      - path: Shared
      - path: prompts
        type: folder
        buildPhase: resources
      # Dot's computer: its Dockerfile, built on first use.
      - path: DotComputer
        type: folder
        buildPhase: resources
    dependencies:
      # The background host that keeps replies running after the app quits, in Contents/MacOS.
      - target: ChatterboxHost
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Video playback in replies.
      - sdk: AVKit.framework
      # Chatterbox's chats as tools for agents (Dot), in Contents/MacOS.
      - target: ChatterboxMCP
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox
        PRODUCT_NAME: Chatterbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatterbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Chatterbox/Chatterbox.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  ChatterboxHost:
    type: tool
    platform: macOS
    sources:
      - path: ChatterboxHost
      - path: Chatterbox/Support/JSON.swift
      - path: Chatterbox/Support/HostProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.Host
        PRODUCT_NAME: ChatterboxHost
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # chatterbox-mcp: the user's chats as MCP tools, talking to the running app over its local
  # agent connection.
  ChatterboxMCP:
    type: tool
    platform: macOS
    sources:
      - path: ChatterboxMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.MCP
        PRODUCT_NAME: chatterbox-mcp
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # The Chatterbox iPhone app: reads and continues chats on the Mac (see Shared/CompanionAPI.swift).
  ChatterboxMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChatterboxMobile
      - path: Shared
      - path: Chatterbox/Views/MarkdownText.swift
      - path: Chatterbox/Views/ReaderStyle.swift
      - path: Chatterbox/Views/PathLinks.swift
    info:
      path: ChatterboxMobile/Info.plist
      properties:
        CFBundleDisplayName: Chatterbox
        ChatterboxAPNsEnvironment: $(APNS_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The iPad turns every way, which also lets it share the screen (Split View, Slide Over).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Chatterbox finds and talks to Chatterbox on your Mac over your network.
        NSBonjourServices: [_chatterbox._tcp]
        NSPhotoLibraryAddUsageDescription: Chatterbox saves images from your chats to Photos when you ask it to.
        NSMicrophoneUsageDescription: Chatterbox listens while you dictate a message.
        NSSpeechRecognitionUsageDescription: Chatterbox turns what you say into the text of your message.
        # The Mac is reached by its home-network or Tailscale address, over plain HTTP on a
        # private network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # iOS 17+ requires explicit numeric-IP exceptions. These match the
          # companion's private/local/Tailscale peer ranges; public HTTP stays blocked.
          NSExceptionDomains:
            "127.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "169.254.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
            "::1":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fe80::/10":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fc00::/7":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.mobile
        PRODUCT_NAME: Chatterbox
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: ChatterboxMobile/ChatterboxMobile.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production

