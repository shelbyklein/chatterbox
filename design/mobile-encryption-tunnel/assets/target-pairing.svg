<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#1e1e1e"/>
  <!-- Mac Settings → iPhone -->
  <text x="40" y="44" fill="#9a9a9a" font-size="13">Mac · Settings → iPhone (target)</text>
  <rect x="40" y="60" width="700" height="520" rx="12" fill="#252525" stroke="#3a3a3a"/>
  <text x="64" y="98" fill="#fff" font-size="20" font-weight="600">iPhone</text>
  <rect x="64" y="116" width="652" height="44" rx="8" fill="#2d2d2d"/>
  <text x="80" y="143" fill="#e8e8e8" font-size="14">Let the Chatterbox iPhone app connect</text>
  <rect x="660" y="128" width="40" height="22" rx="11" fill="#30d158"/><circle cx="689" cy="139" r="9" fill="#fff"/>
  <text x="64" y="194" fill="#e8e8e8" font-size="15" font-weight="600">Pair a phone</text>
  <rect x="64" y="206" width="180" height="180" rx="10" fill="#fff"/>
  <g fill="#111">
    <rect x="80" y="222" width="44" height="44"/><rect x="184" y="222" width="44" height="44"/><rect x="80" y="326" width="44" height="44"/>
    <rect x="136" y="236" width="12" height="12"/><rect x="156" y="252" width="12" height="12"/><rect x="140" y="280" width="12" height="12"/>
    <rect x="168" y="296" width="12" height="12"/><rect x="196" y="300" width="12" height="12"/><rect x="146" y="336" width="12" height="12"/>
    <rect x="176" y="350" width="12" height="12"/><rect x="204" y="330" width="12" height="12"/><rect x="120" y="292" width="12" height="12"/>
  </g>
  <text x="264" y="226" fill="#e8e8e8" font-size="13">Open Chatterbox on your iPhone and tap Pair, then</text>
  <text x="264" y="244" fill="#e8e8e8" font-size="13">point the camera at this code. It works for 10 minutes.</text>
  <text x="264" y="276" fill="#9a9a9a" font-size="12">No camera? Type this code instead:</text>
  <text x="264" y="300" fill="#e8e8e8" font-size="15" font-family="Menlo, monospace">7KQ4-M2XR-9PHD-WT6C-BN3F-YA</text>
  <text x="264" y="332" fill="#9a9a9a" font-size="12">Everything between the phone and this Mac is encrypted;</text>
  <text x="264" y="350" fill="#9a9a9a" font-size="12">the code never leaves the screen.</text>
  <rect x="264" y="362" width="120" height="26" rx="6" fill="#3a3a3a"/><text x="282" y="380" fill="#fff" font-size="12">New code</text>
  <text x="64" y="424" fill="#e8e8e8" font-size="15" font-weight="600">Paired</text>
  <rect x="64" y="436" width="652" height="40" rx="8" fill="#2d2d2d"/>
  <text x="80" y="461" fill="#e8e8e8" font-size="13">Shelby's iPhone 17 Pro</text><text x="560" y="461" fill="#30d158" font-size="12">● Encrypted</text>
  <rect x="64" y="480" width="652" height="40" rx="8" fill="#2d2d2d"/>
  <text x="80" y="505" fill="#e8e8e8" font-size="13">Shelby's iPad mini</text><text x="560" y="505" fill="#ff9f0a" font-size="12">● Re-pair to encrypt</text>
  <rect x="64" y="530" width="652" height="36" rx="8" fill="#2d2d2d"/>
  <text x="80" y="553" fill="#e8e8e8" font-size="13">Require encryption (turn off the old connection)</text>
  <rect x="660" y="537" width="40" height="22" rx="11" fill="#555"/><circle cx="671" cy="548" r="9" fill="#fff"/>
  <!-- iPhone pairing -->
  <text x="800" y="44" fill="#9a9a9a" font-size="13">iPhone · Pair (target)</text>
  <rect x="820" y="60" width="300" height="520" rx="40" fill="#000" stroke="#3a3a3a" stroke-width="3"/>
  <text x="970" y="110" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">Pair with your Mac</text>
  <rect x="850" y="130" width="240" height="240" rx="16" fill="#333"/>
  <path d="M870 170v-20h20 M1050 150h20v20 M1070 330v20h-20 M890 350h-20v-20" stroke="#fff" stroke-width="4" fill="none"/>
  <text x="970" y="255" fill="#bbb" font-size="13" text-anchor="middle">Camera view</text>
  <text x="970" y="400" fill="#ddd" font-size="13" text-anchor="middle">Scan the code in Settings → iPhone</text>
  <text x="970" y="418" fill="#ddd" font-size="13" text-anchor="middle">on your Mac.</text>
  <rect x="860" y="446" width="220" height="40" rx="10" fill="#1c1c1e" stroke="#3a3a3a"/>
  <text x="970" y="471" fill="#0a84ff" font-size="14" text-anchor="middle">Type the code instead</text>
  <text x="970" y="530" fill="#8e8e93" font-size="11" text-anchor="middle">Home Wi-Fi, chatterbox-mac.shelbyklein.com,</text>
  <text x="970" y="546" fill="#8e8e93" font-size="11" text-anchor="middle">or Tailscale, whichever answers first</text>
</svg>
