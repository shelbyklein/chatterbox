<svg xmlns="http://www.w3.org/2000/svg" width="390" height="600" viewBox="0 0 390 600"><rect width="390" height="600" fill="#000"/><g font-family="Arial" font-size="16" fill="white"><text x="162" y="40">Golem</text><text x="350" y="40">⚙</text><rect x="95" y="85" width="275" height="55" rx="20" fill="#236a48"/><text x="110" y="118">Can you summarize the changes?</text><rect x="16" y="165" width="305" height="66" rx="20" fill="#262626"/><text x="30" y="194">The new mobile layout is ready.</text><rect x="16" y="238" width="335" height="88" rx="20" fill="#262626"/><text x="30" y="270">Each paragraph gets its own bubble.</text><text x="30" y="296">Lists and previews stay together.</text><text x="20" y="550">+</text><rect x="53" y="525" width="244" height="46" rx="23" fill="#222"/><text x="70" y="554" fill="#aaa">Message Golem</text><text x="315" y="552">mic</text><text x="355" y="552">↑</text></g></svg>