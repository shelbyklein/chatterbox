# Snippets: small static web artifacts published from Chatterbox, at snippets.shelbyklein.com.
# Caddy serves ../site read-only on 127.0.0.1:3120; the tunnel (tunnel-compose.yaml) publishes it.
name: snippets
services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:3120:8080"
    volumes:
      - ../site:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./private.caddy:/etc/caddy/private.caddy:ro
    read_only: true
    tmpfs: [/data, /config]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The caddy binary carries the bind-port file capability; it must stay in the set.
    cap_add: [NET_BIND_SERVICE]
