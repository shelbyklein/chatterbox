<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450"><rect width="820" height="450" fill="#101113"/><g font-family="Arial" fill="white"><text x="28" y="40" font-size="22">Promote a chat on iPhone</text><rect x="25" y="65" width="240" height="315" rx="20" fill="#232428"/><text x="45" y="100" font-size="18">Chat menu</text><text x="45" y="145">Rename</text><text x="45" y="185">Move to Studio… →</text><text x="45" y="225">Make Project… →</text><text x="45" y="275" fill="#999">Archive</text><rect x="290" y="65" width="240" height="315" rx="20" fill="#232428"/><text x="310" y="100" font-size="18">Move to Studio</text><text x="310" y="145">New Studio / existing</text><text x="310" y="185">Studio name</text><text x="310" y="225">Keep current folder ✓</text><text x="310" y="265" fill="#aaa">History and draft stay.</text><text x="310" y="340" fill="#4ba7ff">Move</text><rect x="555" y="65" width="240" height="315" rx="20" fill="#232428"/><text x="575" y="100" font-size="18">Make Project</text><text x="575" y="145">Mac folder     Browse →</text><text x="575" y="185">Create subfolder    ○</text><text x="575" y="225">Folder name</text><text x="575" y="265" fill="#aaa">Files stay in place.</text><text x="575" y="340" fill="#4ba7ff">Make Project</text><text x="25" y="420" fill="#aaa">Cancel leaves the chat alone. Running replies must finish first.</text></g></svg>