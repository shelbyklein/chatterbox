name: Chatterbox
options:
  bundleIdPrefix: com.shelbyklein
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chatterbox:
    type: application
    platform: macOS
    sources:
      - path: Chatterbox
      - path: prompts
        type: folder
        buildPhase: resources
    dependencies:
      # The background host that keeps replies running after the app quits, in Contents/MacOS.
      - target: ChatterboxHost
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox
        PRODUCT_NAME: Chatterbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatterbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Chatterbox/Chatterbox.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  ChatterboxHost:
    type: tool
    platform: macOS
    sources:
      - path: ChatterboxHost
      - path: Chatterbox/Support/JSON.swift
      - path: Chatterbox/Support/HostProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.Host
        PRODUCT_NAME: ChatterboxHost
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
