name: Chatterbox
options:
  bundleIdPrefix: com.shelbyklein
  deploymentTarget:
    macOS: '14.0'
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
targets:
  Chatterbox:
    type: application
    platform: macOS
    sources:
    - path: Chatterbox/ChatterboxApp.swift
    - path: Chatterbox/Assets.xcassets
      excludes:
      - '*.imageset'
    - path: Core/Chatterbox
    - path: Core/ChatterboxRuntime
    - path: Core/Shared
      excludes:
      - GolemRig.swift
      - GolemRigView.swift
    - path: Core/prompts
      type: folder
      buildPhase: resources
    # The snippet command (bin/snippet); install.sh links it into ~/.local/bin for agents.
    - path: bin
      type: folder
      buildPhase: resources
    dependencies:
    - target: ChatterboxHost
      embed: true
      codeSign: true
      copy:
        destination: executables
    - sdk: AVKit.framework
    - package: SwiftTerm
    - target: ChatterboxMCP
      embed: true
      codeSign: true
      copy:
        destination: executables
    - target: ChatterboxDaemon
      embed: true
      codeSign: true
      copy:
        destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox
        PRODUCT_NAME: Chatterbox
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Chatterbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Chatterbox/Chatterbox.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: Chatterbox/Info.plist
      properties:
        CFBundleURLTypes:
        - CFBundleURLName: com.shelbyklein.Chatterbox.chat
          CFBundleURLSchemes:
          - chatterbox
  ChatterboxHost:
    type: tool
    platform: macOS
    sources:
    - path: ChatterboxHost
    - path: Core/Chatterbox/Support/JSON.swift
    - path: Core/Chatterbox/Support/HostProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.Host
        PRODUCT_NAME: ChatterboxHost
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
  ChatterboxMCP:
    type: tool
    platform: macOS
    sources:
    - path: ChatterboxMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.MCP
        PRODUCT_NAME: chatterbox-mcp
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
  ChatterboxMobile:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: ChatterboxMobile/ChatterboxMobileApp.swift
    - path: ChatterboxMobile/Assets.xcassets
      excludes:
      - '*.imageset'
    - path: Core/ChatterboxMobile
    - path: Core/Shared
      excludes:
      - GolemRig.swift
      - GolemRigView.swift
    - path: Core/Chatterbox/Views/MarkdownText.swift
    - path: Core/Chatterbox/Views/ReaderStyle.swift
    - path: Core/Chatterbox/Views/PathLinks.swift
    info:
      path: ChatterboxMobile/Info.plist
      properties:
        CFBundleDisplayName: Chatterbox
        CFBundleURLTypes:
        - CFBundleURLName: com.shelbyklein.Chatterbox.chat
          CFBundleURLSchemes:
          - chatterbox
        ChatterboxAPNsEnvironment: $(APNS_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Chatterbox finds and talks to Chatterbox on
          your Mac over your network.
        NSBonjourServices:
        - _chatterbox._tcp
        NSPhotoLibraryAddUsageDescription: Chatterbox saves images from your chats
          to Photos when you ask it to.
        NSMicrophoneUsageDescription: Chatterbox listens while you dictate a message.
        NSSpeechRecognitionUsageDescription: Chatterbox turns what you say into the
          text of your message.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.0/8:
              NSExceptionAllowsInsecureHTTPLoads: true
            10.0.0.0/8:
              NSExceptionAllowsInsecureHTTPLoads: true
            172.16.0.0/12:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.0.0/16:
              NSExceptionAllowsInsecureHTTPLoads: true
            169.254.0.0/16:
              NSExceptionAllowsInsecureHTTPLoads: true
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
            ::1:
              NSExceptionAllowsInsecureHTTPLoads: true
            fe80::/10:
              NSExceptionAllowsInsecureHTTPLoads: true
            fc00::/7:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.mobile
        PRODUCT_NAME: Chatterbox
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: 1,2
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        CODE_SIGN_ENTITLEMENTS: ChatterboxMobile/ChatterboxMobile.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    dependencies:
    # The Home Screen and Lock Screen widget, embedded in the app.
    - target: ChatterboxWidget
  ChatterboxWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Core/ChatterboxWidget
    - path: Core/Shared/WidgetSnapshot.swift
    info:
      path: ChatterboxWidget/Info.plist
      properties:
        CFBundleDisplayName: Chatterbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.mobile.widget
        PRODUCT_NAME: ChatterboxWidget
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: 1,2
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        CODE_SIGN_ENTITLEMENTS: ChatterboxWidget/ChatterboxWidget.entitlements
        SKIP_INSTALL: true
  ChatterboxDaemon:
    type: tool
    platform: macOS
    sources:
    - path: Core/Chatterbox/Engine/Models.swift
    - path: Core/Chatterbox/Engine/ChatSession.swift
    - path: Core/Chatterbox/Engine/ChatSession+Claude.swift
    - path: Core/Chatterbox/Engine/ChatSession+Codex.swift
    - path: Core/Chatterbox/Engine/ChatSession+Host.swift
    - path: Core/Chatterbox/Engine/ChatSession+Status.swift
    - path: Core/Chatterbox/Engine/ChatSession+Summary.swift
    - path: Core/Chatterbox/Engine/ChatSession+Shell.swift
    - path: Core/Chatterbox/Engine/ChatSession+Remote.swift
    - path: Core/Chatterbox/Engine/ChatSession+Tasks.swift
    - path: Core/Chatterbox/Engine/ChatSession+Issues.swift
    - path: Core/Chatterbox/Engine/ClaudeCode.swift
    - path: Core/Chatterbox/Engine/CodexAppServer.swift
    - path: Core/Chatterbox/Engine/HostClient.swift
    - path: Core/Chatterbox/Engine/Usage.swift
    - path: Core/Chatterbox/Engine/ClaudeModels.swift
    - path: Core/Chatterbox/Engine/SlashCommands.swift
    - path: Core/Chatterbox/Engine/Tools.swift
    - path: Core/Chatterbox/Engine/ModelPresets.swift
    - path: Core/Chatterbox/Engine/GitHub.swift
    - path: Core/Chatterbox/Engine/GitHubIssues.swift
    - path: Core/Chatterbox/Engine/IssuePrompts.swift
    - path: Core/Chatterbox/Engine/Prompts.swift
    - path: Core/Chatterbox/Engine/PermissionModes.swift
    - path: Core/Chatterbox/Engine/Secrets.swift
    - path: Core/Chatterbox/Engine/EasyCLIProxy.swift
    - path: Core/Chatterbox/Engine/CodexRoute.swift
    - path: Core/Chatterbox/Engine/BackgroundTasks.swift
    - path: Core/Chatterbox/Engine/ChatComputer.swift
    - path: Core/Chatterbox/Engine/ProjectAutomations.swift
    - path: Core/Chatterbox/Engine/CodexModelCatalog.swift
    - path: Core/Chatterbox/Support/JSON.swift
    - path: Core/Chatterbox/Support/HostProtocol.swift
    - path: Core/Chatterbox/Support/Attachments.swift
    - path: Core/Shared/Backend.swift
    - path: Core/Shared/MediaKind.swift
    - path: Core/Shared/FilePaths.swift
    - path: Core/ChatterboxRuntime/AssistantInstructions.swift
    - path: Core/ChatterboxRuntime/RuntimeWire.swift
    - path: Core/ChatterboxRuntime/RuntimePaths.swift
    - path: Core/ChatterboxRuntime/RuntimeSocket.swift
    - path: Core/ChatterboxRuntime/ChatSession+Media.swift
    - path: Core/ChatterboxRuntime/AssistantConfiguration.swift
    - path: Core/ChatterboxRuntime/ConversationRuntime.swift
    - path: Core/ChatterboxRuntime/RuntimePreferences.swift
    - path: Core/ChatterboxRuntime/RuntimePeer.swift
    - path: Core/ChatterboxRuntime/RuntimeClient.swift
    - path: Core/ChatterboxRuntime/Studio.swift
    - path: Core/Chatterbox/Engine/CompanionServer.swift
    - path: Core/Chatterbox/Engine/CompanionDocuments.swift
    - path: Core/Chatterbox/Engine/CompanionMutationLedger.swift
    - path: Core/Chatterbox/Engine/NextSteps.swift
    - path: Core/Chatterbox/Engine/MobilePush.swift
    - path: Core/Chatterbox/Engine/Pins.swift
    - path: Core/Chatterbox/Support/HTTPFileTransfer.swift
    - path: Core/Shared/CompanionAPI.swift
    - path: Core/Shared/CompanionRetry.swift
    - path: ChatterboxDaemon
    - path: Core/Shared/AppPreferences.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.Chatterbox.Daemon
        PRODUCT_NAME: chatterboxd
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 9F3MKVW9C5
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CHATTERBOX_HEADLESS
  ChatterboxMobileProductTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: tests/golem-integration/MobileProductTests.swift
    dependencies:
    - target: ChatterboxMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbyklein.ChatterboxMobileProductTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
schemes:
  Chatterbox:
    build:
      targets:
        Chatterbox: all
  ChatterboxMobile:
    build:
      targets:
        ChatterboxMobile: all
  ChatterboxMobileAcceptance:
    build:
      targets:
        ChatterboxMobile: all
        ChatterboxMobileProductTests: all
    test:
      targets:
      - ChatterboxMobileProductTests
